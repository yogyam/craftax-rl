[project]
name = "craftax-rl"
version = "0.1.0"
description = "Five PPO experiments in Craftax-Classic: survival shaping, reconstructible memory, and late-game practice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "craftax==1.6.1",
    "jax>=0.11,<0.13",
    "flax>=0.12,<0.13",
    "optax>=0.2.8,<0.3",
    "numpy>=2.2,<3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/craftax_rl"]
